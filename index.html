<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta
      name="description"
      content="Nutrición JR — dietas personalizadas a partir de tu edad, tu peso, tu deporte y tu salud."
    />

    <!-- Instalación como app en iOS: Safari no lee el manifest.webmanifest
         para esto, hace falta declararlo aparte. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nutrición JR" />

    <title>Nutrición JR — dietas personalizadas</title>
    <link rel="canonical" href="https://nutricion-jr.web.app/" />

    <!-- Verificación de propiedad en Google Search Console. -->
    <meta name="google-site-verification" content="wYhvkFndg4irXTIf5fHzvIs0o1GAvGn6ejUsWSw_prc" />

    <!-- Vista previa al compartir el enlace (WhatsApp, redes, etc.). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nutrición JR" />
    <meta property="og:title" content="Nutrición JR — dietas personalizadas" />
    <meta
      property="og:description"
      content="Tu dieta calculada según tu edad, tu peso, tu deporte y tu salud. Datos nutricionales de USDA y BEDCA."
    />
    <meta property="og:url" content="https://nutricion-jr.web.app/" />
    <meta property="og:image" content="https://nutricion-jr.web.app/icons/icon-512.png" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
