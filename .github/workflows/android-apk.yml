# Compila el APK de release en los runners de GitHub, porque en la máquina
# de desarrollo (Windows) no hay ni JDK ni Android SDK instalados.
#
# Se dispara a mano desde la pestaña Actions, o al publicar un tag "v*".
# El APK queda como artefacto de la ejecución y, si es un tag, también
# adjunto a la Release para poder enlazarlo desde la web.
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # El CLI de Capacitor exige Node >= 22.
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Restaurar google-services.json
        # Sin este archivo Gradle no aplica el plugin de Google Services, la
        # app compila igual y el login con Google falla en tiempo de ejecución.
        # Mejor romper aquí que publicar un APK en el que nadie puede entrar.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Falta el secreto GOOGLE_SERVICES_JSON" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Restaurar el keystore de firma
        # El keystore se guarda en base64 como secreto del repositorio; nunca
        # se versiona. Sin él el APK saldría sin firmar y Android no lo
        # instalaría.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/keystore
          # Se limpian saltos de línea y espacios antes de decodificar: al
          # copiar el base64 desde Windows, el portapapeles añade un retorno
          # de carro que base64 rechaza como entrada inválida.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/keystore/nutricionjr.keystore
          # Comprobar aquí que el keystore es legible evita que un fallo de
          # copiado aparezca más tarde como un error de firma indescifrable.
          keytool -list -keystore android/keystore/nutricionjr.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Construir el APK firmado
        run: |
          npx cap build android \
            --androidreleasetype APK \
            --keystorepath keystore/nutricionjr.keystore \
            --keystorepass "$KEYSTORE_PASSWORD" \
            --keystorealias "$KEY_ALIAS" \
            --keystorealiaspass "$KEY_PASSWORD"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Localizar el APK
        id: apk
        run: echo "path=$(find android -name '*-signed.apk' -o -name 'app-release*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nutricion-jr-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
